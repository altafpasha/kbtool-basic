<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KBTool — Transaction ID Formatter</title>
  <meta name="description" content="Instantly format and copy transaction IDs with optional loan ID prefix." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="./style.css?v=1.1" />
</head>
<body>

  <!-- Toast container -->
  <div id="toast-container">
    <div id="toast-copied" class="toast toast-white" hidden>
      <i class="fas fa-check"></i> Copied to clipboard
    </div>
    <div id="toast-duplicate" class="toast toast-alert" hidden>
      <div class="toast-header">
        <i class="fas fa-exclamation-triangle"></i>
        <strong>Duplicate IDs detected</strong>
        <button id="close-dup-toast" class="toast-close">×</button>
      </div>
      <p id="toast-dup-ids" class="toast-body"></p>
    </div>
  </div>

  <main class="container">
    <div class="card">

      <!-- ── Header ── -->
      <header class="card-header">
        <div class="header-left">
          <div class="logo-mark"><i class="fas fa-bolt"></i></div>
          <div>
            <p class="step-label"><i class="fas fa-circle-dot"></i> KBTool</p>
            <h1 class="card-title">Transaction Formatter</h1>
            <p class="card-subtitle">Paste IDs → auto formats, detects dupes &amp; copies instantly</p>
          </div>
        </div>
        <span class="badge-new">Dupe Detector</span>
      </header>

      <div class="divider"></div>

      <!-- ── Body: two columns on wide screens ── -->
      <div class="card-body">

        <!-- Left col: inputs -->
        <section class="col-inputs">
          <div class="section-label">
            <i class="fas fa-keyboard"></i> Inputs
          </div>

          <div class="input-group">
            <label class="input-label" for="loan-id">
              <i class="fas fa-tag"></i> Loan / QID prefix
            </label>
            <input
              id="loan-id"
              type="text"
              class="input-field"
              placeholder="e.g. QID 106"
              autocomplete="off"
              spellcheck="false"
            />
          </div>

          <div class="input-group">
            <label class="input-label" for="ids-input">
              <i class="fas fa-list-ol"></i> Transaction IDs
            </label>
            <textarea
              id="ids-input"
              class="input-field input-textarea"
              placeholder="Paste or type IDs — comma or space separated…"
              rows="4"
              spellcheck="false"
            ></textarea>
          </div>

          <!-- Toggles -->
          <div class="toggles-row">
            <label class="toggle-wrap" for="toggle-auto">
              <input type="checkbox" id="toggle-auto" class="toggle-input" checked />
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
              <span class="toggle-label" id="auto-label">Auto</span>
            </label>
            <label class="toggle-wrap" for="toggle-autoreset">
              <input type="checkbox" id="toggle-autoreset" class="toggle-input" checked />
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
              <span class="toggle-label">Auto-Reset</span>
            </label>
          </div>
        </section>

        <!-- Right col: output + actions -->
        <section class="col-output">
          <div class="section-label">
            <i class="fas fa-terminal"></i> Result
          </div>

          <div id="output" class="output-box">
            <span class="output-placeholder">Result will appear here…</span>
          </div>

          <div class="action-row">
            <button id="btn-convert" class="btn btn-primary">
              <i class="fas fa-copy"></i> Convert &amp; Copy
              <i class="fas fa-arrow-right btn-arrow"></i>
            </button>
            <button id="btn-reset" class="btn btn-ghost">
              <i class="fas fa-rotate-left"></i> Reset
              <span id="reset-counter" class="counter-badge">0</span>
            </button>
          </div>
        </section>
      </div>

      <div class="card-glow-bottom"></div>
    </div>
  </main>

  <script src="./app.js?v=1.1"></script>
</body>
</html>
